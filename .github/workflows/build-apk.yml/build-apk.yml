name: Build MultiWeb10 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -q MultiWeb10-mobile-build.zip -d extracted

      - name: Build APK
        working-directory: extracted/MultiWeb10
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiWeb10-APK
          path: extracted/MultiWeb10/app/build/outputs/apk/debug/app-debug.apk
